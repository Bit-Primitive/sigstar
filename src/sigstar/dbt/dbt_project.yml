name: sigstar
version: "0.1.0"
config-version: 2
profile: sigstar

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# sigstar passes these with --vars from sigstar.yml; the defaults keep `dbt parse` working.
vars:
  assets: []
  topics: []
  news_rules: []
  stablecoins: []
  fred_series: []
  chainstar_enabled: false
  # Whether the chainstar warehouse has fct_token_prices and fct_swaps (sigstar checks).
  chainstar_prices: false
  # From sources.licence_mode: what the staging models leave out (see macros/licence.sql).
  licence:
    mode: personal
    excluded: {candles: [], derivatives: [], news: []}
    fear_greed: true
    fred_series: null
  zscore_window: 30
  zscore_min_obs: 10
  # On-chain z-scores compare a day only with earlier days on which every contributing chain
  # was loaded with a block count within this share of the day's own (0.1 = 10%).
  onchain_coverage_tolerance: 0.1
  # Reference price per asset: the first venue in this list with a close that day. onchain
  # (chainstar's price from DEX swaps) comes last: in personal mode it fills days no
  # exchange has; in commercial mode it is the only venue.
  venue_priority: ["coinbase", "kraken", "binance", "onchain"]
  # Cross-venue spread compares venues quoted in the same currency, so a USDT premium
  # never shows up as a price gap.
  spread_quote: USD

models:
  sigstar:
    staging:
      +schema: sigstar_staging
      +materialized: view
    intermediate:
      +schema: sigstar_staging
      +materialized: table
    marts:
      +schema: sigstar
      +materialized: table
