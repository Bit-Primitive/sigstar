# Dependency updates for sigstar, grouped so they arrive as a few pull requests a
# week rather than one per package. Security updates are raised as soon as
# GitHub knows of them, whatever the schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
